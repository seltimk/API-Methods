<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet">
    <title>DUMMY APIs</title>
</head>

<body class="bg-gray-950">

    <div class=" text-center m-10">

        <h1 class="text-4xl text-amber-50">DUMMY APIs</h1>
        
    </div>
    <main class=" grid grid-cols-3 bg-gray-700">



        <div class="text-center m-5 col-span-1 h-[600px] bg-gray-700">
            <h2 class="text-2xl mt-0.5 text-center font-bold text-amber-50 mt-5">GET APIs</h2>
           <div class="mt-3">

             <button id="all-post-btn"
                class="bg-green-700 text-amber-50 text-[15px] p-1.5 rounded-xl hover:cursor-pointer hover:bg-green-800 ">Get
                All Post</button>

            <button id="one-post-btn"
                class="bg-green-600 text-amber-50 text-[15px] p-1.5 rounded-xl hover:cursor-pointer hover:bg-green-700">Get
                Number 5 Post</button>
           </div>

                 <!-- PUT SECTION -->
            <section class="mx-5">

                <div>

                   <h2 class="text-2xl  text-center font-bold text-amber-50 mt-10">POST Method</h2>

                   <button id="post-btn"
                class="bg-yellow-500 text-amber-50 text-[15px] p-1.5 rounded-xl hover:cursor-pointer hover:bg-green-700 font-bold">Post Request</button>

                </div>

            </section>


              <!-- PUT SECTION -->
            <section class="mx-5">

                <div>

                   <h2 class="text-2xl  text-center font-bold text-amber-50 mt-10">PUT Method</h2>

                   <button id="put-btn"
                class="bg-orange-600 text-amber-50 text-[15px] p-1.5 rounded-xl hover:cursor-pointer hover:bg-orange-600 font-bold">Put Request</button>

                </div>

            </section>

             <!-- PATCH SECTION -->
            <section class="mx-5">

                <div>

                   <h2 class="text-2xl  text-center font-bold text-amber-50 mt-10">PATCH Method</h2>

                   <button id="patch-btn"
                class="bg-green-800 text-amber-50 text-[15px] p-1.5 rounded-xl hover:cursor-pointer hover:bg-green-700 font-bold">Patch Request</button>

                </div>

            </section>


              <!-- DELETE SECTION -->
            <section class="mx-5">

                <div>

                   <h2 class="text-2xl  text-center font-bold text-amber-50 mt-10">Delete Method</h2>

                   <button id="del-btn"
                class="bg-red-600 text-amber-50 text-[15px] p-1.5 rounded-xl hover:cursor-pointer hover:bg-red-700 font-bold">Delete Request</button>

                </div>

            </section>
        </div>

        <div class="bg-gray-950 col-span-2 sh">
            <div>
                <div id="get-parent-div"
                    class="div-style bg-gray-700 m-auto w-[75%] h-[700px] overflow-scroll grid grid-cols-1 gap-5  md:grid-cols-2 lg:grid-cols-2 auto-rows-auto">
                </div>

            </div>
        </div>

    </main>
    <script src="script.js"></script>
</body>

</html>
